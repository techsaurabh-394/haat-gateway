name: Welcome first-time contributors
on:
  issues: { types: [opened] }
  pull_request_target: { types: [opened] }
permissions:
  issues: write
  pull-requests: write
jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Thanks for opening your first issue in Haat! A maintainer aims to reply within 48 hours. If you'd like to work on it yourself, say so and we'll help."
          pr-message: "Thanks for your first pull request to Haat! Please make sure `npm run check` passes. A maintainer will review within 48 hours."
