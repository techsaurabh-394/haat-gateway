<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">Haat gateway</title>
  <desc id="d">A personal AI agent sends a shopping request. It stops at the Haat gateway, where the person approves the exact order, then goes to sellers on India's open commerce network.</desc>
  <style>
    :root { --bg:#ffffff; --ink:#1c2033; --muted:#5b6178; --indigo:#26346f; --marigold:#efa00b; --leaf:#2e7a4b; --teal:#13707f; --card:#f3f5fb; --line:#c9cee0; --on:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141831; --ink:#e9ecf7; --muted:#a6acc6; --indigo:#8fa2ec; --marigold:#f5b437; --leaf:#5cc489; --teal:#4fc0cf; --card:#1e2344; --line:#3a4170; --on:#0f1430; }
    }
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font: 600 64px "Iowan Old Style", "Palatino Linotype", Georgia, serif; fill: var(--ink); letter-spacing: -1px; }
    .sub { font: 400 21px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--muted); }
    .label { font: 600 17px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
    .small { font: 400 14px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--muted); }
    .hindi { font: 400 15px "Noto Sans Devanagari", "Mangal", "Nirmala UI", sans-serif; fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .route { fill: none; stroke: var(--line); stroke-width: 2.5; stroke-dasharray: 2 8; stroke-linecap: round; }
    .packet { fill: var(--teal); }
    .flower { fill: var(--marigold); }
    .leafc { fill: var(--leaf); }
    .awning-a { fill: var(--indigo); }
    .awning-b { fill: var(--marigold); }
    .gate-post { fill: var(--indigo); }
    .ask { opacity: 0; }
    .ok { opacity: 0; }
    .ask { animation: ask 7s infinite; }
    .ok { animation: ok 7s infinite; }
    @keyframes ask { 0%, 26% { opacity: 0; } 30%, 52% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes ok { 0%, 48% { opacity: 0; } 52%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .mover { display: none; }
      .ask { animation: none; opacity: 0; }
      .ok { animation: none; opacity: 1; }
    }
  </style>

  <rect class="bg" width="1200" height="460"/>

  <!-- Title -->
  <text class="title" x="60" y="104">Haat</text>
  <text class="sub" x="62" y="142">Personal AI agents can shop on India's open network.</text>
  <text class="sub" x="62" y="170">Nothing is ordered until you say yes.</text>

  <!-- Routes -->
  <path id="r1" class="route" d="M 250 330 L 520 330"/>
  <path id="r2a" class="route" d="M 680 330 C 760 330 800 250 905 250"/>
  <path id="r2b" class="route" d="M 680 330 L 905 330"/>
  <path id="r2c" class="route" d="M 680 330 C 760 330 800 410 905 410"/>

  <!-- Personal agent -->
  <g transform="translate(60 270)">
    <rect class="card" width="190" height="120" rx="18"/>
    <rect x="22" y="22" width="112" height="34" rx="12" style="fill:var(--indigo)"/>
    <text x="34" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="14" style="fill:var(--on)">2 kilo aata…</text>
    <circle cx="160" cy="39" r="8" class="packet"/>
    <text class="label" x="22" y="84">Your agent</text>
    <text class="small" x="22" y="104">any Poppy client</text>
  </g>

  <!-- Haat gateway with toran (marigold garland) -->
  <g transform="translate(520 260)">
    <rect class="gate-post" x="0" y="20" width="14" height="130" rx="4"/>
    <rect class="gate-post" x="146" y="20" width="14" height="130" rx="4"/>
    <rect class="gate-post" x="-6" y="10" width="172" height="14" rx="5"/>
    <!-- garland -->
    <g>
      <circle class="flower" cx="10" cy="34" r="7"/>
      <circle class="flower" cx="27" cy="44" r="7"/>
      <circle class="flower" cx="45" cy="51" r="7"/>
      <circle class="leafc" cx="63" cy="55" r="6"/>
      <circle class="flower" cx="80" cy="57" r="7"/>
      <circle class="leafc" cx="97" cy="55" r="6"/>
      <circle class="flower" cx="115" cy="51" r="7"/>
      <circle class="flower" cx="133" cy="44" r="7"/>
      <circle class="flower" cx="150" cy="34" r="7"/>
    </g>
    <text class="label" x="34" y="104">Haat</text>
    <text class="small" x="34" y="124">gateway</text>
    <text class="hindi" x="34" y="144">हाट</text>
  </g>

  <!-- Approval card (appears while the request waits at the gate) -->
  <g class="ask" transform="translate(450 190)">
    <rect class="card" width="300" height="58" rx="12" style="stroke:var(--marigold);stroke-width:2"/>
    <text class="label" x="16" y="25">Approve this order?</text>
    <text class="small" x="16" y="45">Assi Sabzi Mandi, ₹129, pay on delivery</text>
  </g>
  <g class="ok" transform="translate(450 190)">
    <rect width="300" height="58" rx="12" style="fill:var(--leaf)"/>
    <text x="18" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" style="fill:var(--on)">✓ Approved by you, once</text>
  </g>

  <!-- Sellers: shop awnings -->
  <g transform="translate(905 215)">
    <path class="awning-a" d="M0 0 h48 l-8 18 h-32 z"/><path class="awning-b" d="M48 0 h48 l-8 18 h-32 z"/>
    <text class="label" x="110" y="16">Kashi Kirana Store</text>
    <text class="small" x="110" y="36">Lanka</text>
  </g>
  <g transform="translate(905 295)">
    <path class="awning-b" d="M0 0 h48 l-8 18 h-32 z"/><path class="awning-a" d="M48 0 h48 l-8 18 h-32 z"/>
    <text class="label" x="110" y="16">Ganga Dairy</text>
    <text class="small" x="110" y="36">Assi Ghat</text>
  </g>
  <g transform="translate(905 375)">
    <path class="awning-a" d="M0 0 h48 l-8 18 h-32 z"/><path class="awning-b" d="M48 0 h48 l-8 18 h-32 z"/>
    <text class="label" x="110" y="16">Assi Sabzi Mandi</text>
    <text class="small" x="110" y="36">Assi</text>
  </g>
  <text class="small" x="905" y="200">ONDC sellers (Beckn protocol)</text>

  <!-- Moving packets (SMIL works in GitHub's image renderer) -->
  <circle class="packet mover" r="9">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1;1;1" keyTimes="0;0.28;0.55;1" calcMode="linear"><mpath href="#r1"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.55;0.56;1"/>
  </circle>
  <circle class="packet mover" r="8" opacity="0">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.56;0.85;1" calcMode="linear"><mpath href="#r2a"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.555;0.56;0.92;1"/>
  </circle>
  <circle class="packet mover" r="8" opacity="0">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.56;0.85;1" calcMode="linear"><mpath href="#r2b"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.555;0.56;0.92;1"/>
  </circle>
  <circle class="packet mover" r="8" opacity="0">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.56;0.85;1" calcMode="linear"><mpath href="#r2c"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.555;0.56;0.92;1"/>
  </circle>
</svg>
