<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-labelledby="t d">
  <title id="t">Approval gate state machine</title>
  <desc id="d">States of an operation from request to approval to a single performed action, with the paths for changed terms, failures and unknown outcomes.</desc>
  <style>
    :root { --bg:#ffffff; --ink:#1c2033; --muted:#5b6178; --indigo:#26346f; --marigold:#efa00b; --leaf:#2e7a4b; --teal:#13707f; --card:#f3f5fb; --line:#c9cee0; --on:#ffffff; --red:#b3372f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141831; --ink:#e9ecf7; --muted:#a6acc6; --indigo:#8fa2ec; --marigold:#f5b437; --leaf:#5cc489; --teal:#4fc0cf; --card:#1e2344; --line:#3a4170; --on:#0f1430; --red:#ef8178; }
    }
    .bg{fill:var(--bg)} .h{font:600 26px "Iowan Old Style","Palatino Linotype",Georgia,serif;fill:var(--ink)}
    .t{font:600 15px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
    .s{font:400 13px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--muted)}
    .m{font:400 13px ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;fill:var(--ink)}
    .card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
    .life{stroke:var(--line);stroke-width:2;stroke-dasharray:4 6}
    .arrow{stroke:var(--teal);stroke-width:2.2;fill:none;marker-end:url(#ah)}
    .arrow.back{stroke:var(--indigo);stroke-dasharray:6 5;marker-end:url(#ahb)}
    .arrow.human{stroke:var(--marigold);marker-end:url(#ahm)}
    .arrow.bad{stroke:var(--red);marker-end:url(#ahr)}
    .gate{fill:none;stroke:var(--marigold);stroke-width:2.5}
    .pill{fill:var(--indigo)} .pilltxt{font:600 13px "Segoe UI",Arial,sans-serif;fill:var(--on)}
    .good{fill:var(--leaf)} .warn{fill:var(--marigold)} .teal{fill:var(--teal)}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" style="fill:var(--teal)"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" style="fill:var(--indigo)"/></marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" style="fill:var(--marigold)"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <rect class="bg" width="1100" height="470"/>
  <text class="h" x="40" y="50" text-anchor="start">The approval gate</text>
  <text class="s" x="40" y="76" text-anchor="start">Every order and cancellation passes through it. Approval covers one exact revision; the action runs at most once.</text>
  <rect class="card" x="60" y="150" width="190" height="64" rx="12"/>
  <text class="t" x="74" y="174" text-anchor="start">Request arrives</text>
  <text class="s" x="74" y="194" text-anchor="start">no approval yet</text>
  <rect class="card" x="320" y="150" width="230" height="82" rx="12"/>
  <text class="t" x="334" y="174" text-anchor="start">approval_required</text>
  <text class="s" x="334" y="194" text-anchor="start">quote: select + init</text>
  <text class="s" x="334" y="212" text-anchor="start">operation_id + revision</text>
  <rect class="card" x="630" y="150" width="190" height="64" rx="12"/>
  <text class="t" x="644" y="174" text-anchor="start">performing</text>
  <text class="s" x="644" y="194" text-anchor="start">Beckn confirm</text>
  <rect class="card" x="890" y="150" width="170" height="82" rx="12"/>
  <text class="t" x="904" y="174" text-anchor="start">performed</text>
  <text class="s" x="904" y="194" text-anchor="start">result stored,</text>
  <text class="s" x="904" y="212" text-anchor="start">replayed on retry</text>
  <line class="arrow" x1="252" y1="182" x2="316" y2="182"/>
  <line class="arrow human" x1="552" y1="182" x2="626" y2="182"/>
  <text class="s" x="589" y="170" text-anchor="middle">person: yes</text>
  <line class="arrow" x1="822" y1="182" x2="886" y2="182"/>
  <path class="arrow bad" d="M 435 236 C 435 300 360 300 360 240"/>
  <text class="s" x="300" y="318" text-anchor="start">changed cart, expired, or another Session&#x27;s</text>
  <text class="s" x="300" y="336" text-anchor="start">approval: nothing runs, new revision</text>
  <path class="arrow back" d="M 725 216 C 725 300 500 330 470 240"/>
  <text class="s" x="560" y="372" text-anchor="start">seller says no: back to approvable</text>
  <path class="arrow back" d="M 760 216 C 820 290 860 290 900 290"/>
  <text class="s" x="905" y="288" text-anchor="start">outcome unknown:</text>
  <text class="s" x="905" y="306" text-anchor="start">503 + Retry-After,</text>
  <text class="s" x="905" y="324" text-anchor="start">never &#x27;failed&#x27;</text>
  <path class="arrow back" d="M 1000 218 C 1000 260 960 260 960 222"/>
  <text class="s" x="940" y="250" text-anchor="end">same approval again</text>
  <text class="s" x="40" y="430" text-anchor="start">Spec: Personal Agent Protocol draft 0.3, Operations extension version 2, sections 3 to 7. Code: src/poppy/operations.ts. Tests: test/operations.test.ts.</text>

</svg>
